services:
  gateway:
    container_name: ms_gateway
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - users
    env_file:
      - ./gateway/.env
    networks:
      - gateway_network
      - users_network
      - chat_network
      - listing_network
      - notifications_network
    volumes:
      - ./gateway_data:/app
    restart: unless-stopped

  users:
    container_name: ms_users
    build:
      context: ./users
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      - db
    env_file:
      - ./users/.env
    networks:
      - users_network
      - gateway_network
      - db_network
    volumes:
      - ./users_data:/app
    restart: unless-stopped

  listing:
    container_name: ms_listing
    build:
      context: ./listing
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    depends_on:
      - db
      - floci
    env_file:
      - ./listing/.env
    environment:
      S3_ENDPOINT: http://floci:4566
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
      S3_BUCKET: fake-vinted-listing-images
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      IMAGE_PROCESSOR_API_KEY: ${IMAGE_PROCESSOR_API_KEY:?set it in the root .env}
    networks:
      - listing_network
      - users_network
      - gateway_network
      - db_network
    volumes:
      - ./listing_data:/app
    restart: unless-stopped

  chat_vinted:
    container_name: ms_chat
    build:
      context: ./chat_vinted
      dockerfile: Dockerfile
    ports:
      - "4002:4002"
    depends_on:
      - db
      - rabbitmq
    env_file:
      - ./chat_vinted/.env
    networks:
      - chat_network
      - gateway_network
      - db_network
      - notifications_network
    volumes:
      - ./chat_data:/app
    restart: unless-stopped

  notifications:
    container_name: ms_notifications
    build:
      context: ./notifications
      dockerfile: Dockerfile
    ports:
      - "4003:4003"
    depends_on:
      - db
      - rabbitmq
    env_file:
      - ./notifications/.env
    networks:
      - notifications_network
      - gateway_network
      - db_network
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    user: root
    volumes:
      - ./alloy/:/etc/alloy/
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - grafana
      - db_network
      - gateway_network
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    env_file:
      - ./.env
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - loki
      - prometheus

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki:/etc/loki/
      - loki_data:/loki/
    ports:
      - "3100:3100"
    networks:
      - grafana
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway
    container_name: pushgateway
    ports:
      - "9091:9091"
    networks:
      - grafana
    restart: always

  db:
    image: postgres:15
    container_name: postgres_db
    shm_size: 512mb
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER_NAME}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${DB_MULTIPLE_DATABASES}
    ports:
      - "5432:5432"
    volumes:
      - pg_db_data:/var/lib/postgresql/data
      - ./postgres/init-db:/docker-entrypoint-initdb.d:ro
    networks:
      db_network:
        ipv4_address: 10.5.0.10
      grafana:
      users_network:
    restart: always

  prometheus:
    image: prom/prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus:/etc/prometheus/
    command:
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=1d'
      - '--storage.tsdb.retention.size=512MB'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - grafana
    restart: always

  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    depends_on:
      - prometheus
      - loki
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
    restart: always
    networks:
      - grafana
      - db_network

  floci:
    build:
      context: ./floci
    container_name: fake_vinted_floci
    group_add:
      - ${DOCKER_GID:-998}
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: 120
      FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK: fake-vinted_listing_network
      FLOCI_SERVICES_LAMBDA_DOCKER_HOST_OVERRIDE: floci
      S3_BUCKET: fake-vinted-listing-images
      LISTING_INTERNAL_URL: http://ms_listing:4001
      IMAGE_PROCESSOR_API_KEY: ${IMAGE_PROCESSOR_API_KEY:?set it in the root .env}
    volumes:
      - floci_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./floci/init/ready.d:/etc/floci/init/ready.d:ro
    networks:
      - listing_network
      - loadtest_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fake-vinted-redis
    ports:
      - "6379:6379"
    networks:
      - chat_network
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fake_vinted_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ./.env
    networks:
      - notifications_network
      - users_network
      - gateway_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: fake-vinted-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf 
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - gateway
      - chat_vinted
    networks:
      gateway_network:
      chat_network:
      loadtest_network:
        aliases:
          - fake-vinted.local
    restart: unless-stopped

  k6:
    build:
      context: ./k6
      dockerfile: Dockerfile
    container_name: fake_vinted_k6
    profiles:
      - loadtest
    cap_add:
      - NET_ADMIN
    depends_on:
      - db
      - redis
      - rabbitmq
      - users
      - listing
      - chat_vinted
      - notifications
      - gateway
      - nginx
      - floci
    environment:
      S3_URL: http://floci:4566
    networks:
      - loadtest_network
    volumes:
      - ./k6.test.fake.vinted.js:/scripts/k6.test.fake.vinted.js:ro
      - ./k6/fixtures:/scripts/k6/fixtures:ro
      - ./k6_reports:/reports
    command: ["/scripts/k6.test.fake.vinted.js"]

volumes:
  loki_data:
  pg_db_data:
  floci_data:
  grafana_data:
  prometheus_data:
  redis_data:
  gateway_data:
  users_data:
  listing_data:
  chat_data:

networks:
  notifications_network:
    driver: bridge
  chat_network:
    driver: bridge
  listing_network:
    name: fake-vinted_listing_network
    driver: bridge
  gateway_network:
    driver: bridge
  users_network:
    driver: bridge
  grafana:
    driver: bridge
  db_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24
          gateway: 10.5.0.1
  loadtest_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.90.0.0/16
          gateway: 10.90.0.1